<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赤ちゃん用品準備リスト</title>
<style>
  :root {
    --bg: #fdf6f2;
    --card-bg: #ffffff;
    --accent: #f4a6a0;
    --accent-dark: #d97a72;
    --accent-soft: #fff0ee;
    --text: #4a4340;
    --text-light: #9a908c;
    --border: #f0e2db;
    --danger: #e57373;
    --shadow: 0 1px 3px rgba(120, 90, 80, 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 18px 16px 40px;
  }
  .container {
    max-width: 1040px;
    margin: 0 auto;
  }

  /* ---- header ---- */
  header {
    text-align: center;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }

  /* ---- summary ---- */
  .summary {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .summary .total {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .summary .total .label {
    font-size: 12px;
    color: var(--text-light);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .summary .total .amount {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-dark);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .summary .meta {
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .summary .meta b {
    color: var(--text);
    font-weight: 600;
  }
  .summary .meta .purchased-line {
    color: var(--accent-dark);
  }
  .summary .meta .purchased-line b { color: var(--accent-dark); }
  .export-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent-dark);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .export-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  /* ---- add form ---- */
  .add-form {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .add-form input {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    color: inherit;
    background: #fff;
    min-width: 0;
  }
  .add-form input:focus {
    border-color: var(--accent);
  }
  .add-form .f-name  { flex: 2 1 160px; }
  .add-form .f-price { flex: 0 1 120px; }
  .add-form .f-url   { flex: 3 1 200px; }
  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    width: 42px;
    height: 42px;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    transition: background 0.15s;
  }
  .add-btn:hover { background: var(--accent-dark); }

  /* ---- list ---- */
  .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 10px;
  }
  .item {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 12px 10px 40px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 5px;
    transition: opacity 0.15s, background 0.15s;
  }
  .item.purchased {
    background: var(--accent-soft);
    opacity: 0.72;
  }
  .item .check {
    position: absolute;
    top: 11px;
    left: 10px;
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent-dark);
    cursor: pointer;
  }
  .item .name {
    font-weight: 600;
    font-size: 13.5px;
    margin: 0;
    padding-right: 46px;
    line-height: 1.35;
    word-break: break-word;
  }
  .item.purchased .name {
    text-decoration: line-through;
    color: var(--text-light);
  }
  .edit-input {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 7px;
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    width: 100%;
    color: inherit;
    background: #fff;
  }
  .edit-input:focus { border-color: var(--accent); }
  .name-input {
    font-weight: 600;
    font-size: 13px;
    padding-right: 26px;
  }
  .price-field {
    display: flex;
    align-items: center;
    gap: 2px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 1px;
    max-width: 130px;
  }
  .price-field .yen {
    font-size: 13px;
    color: var(--text-light);
    flex: 0 0 auto;
  }
  .price-input {
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-dark);
    padding: 1px 0;
    width: 100%;
    min-width: 0;
  }
  .price-input::placeholder {
    color: #cfc4bf;
    font-weight: 400;
  }
  .price-field:focus-within {
    border-bottom-color: var(--accent);
  }
  .item a.url {
    color: var(--accent-dark);
    font-size: 11.5px;
    text-decoration: none;
    line-height: 1.3;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item a.url:hover { text-decoration: underline; }
  .item .actions {
    position: absolute;
    top: 5px;
    right: 5px;
    display: flex;
    gap: 1px;
  }
  .icon-btn {
    background: none;
    border: none;
    color: #cfc4bf;
    cursor: pointer;
    font-size: 13px;
    width: 22px;
    height: 22px;
    line-height: 1;
    border-radius: 7px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .edit-btn:hover, .done-btn {
    color: var(--accent-dark);
    background: var(--accent-soft);
  }
  .done-btn:hover { background: var(--accent); color: #fff; }
  .delete-btn:hover {
    color: var(--danger);
    background: #fdecea;
  }
  .empty {
    text-align: center;
    color: var(--text-light);
    padding: 40px 0;
    font-size: 14px;
  }

  @media (max-width: 560px) {
    .add-form { flex-wrap: wrap; }
    .add-form .f-name  { flex: 1 1 100%; }
    .add-form .f-price { flex: 1 1 90px; }
    .add-form .f-url   { flex: 3 1 120px; }
    .list { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .summary { padding: 12px 16px; gap: 6px 12px; }
    .summary .total { flex: 1 1 100%; }
    .summary .meta { flex: 1 1 100%; white-space: normal; align-items: flex-start; }
    .summary .total .amount { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍼 赤ちゃん用品準備リスト</h1>
  </header>

  <div class="summary">
    <div class="total">
      <span class="label">合計</span>
      <span class="amount" id="total-amount">¥0</span>
    </div>
    <div class="meta" id="summary-meta"></div>
    <button type="button" class="export-btn" id="export-btn">CSV出力</button>
  </div>

  <form class="add-form" id="add-form">
    <input class="f-name" type="text" id="input-name" placeholder="アイテム名（例：おむつ）" required>
    <input class="f-price" type="number" id="input-price" placeholder="金額" min="0" step="1">
    <input class="f-url" type="text" id="input-url" placeholder="URL（任意）" inputmode="url">
    <button type="submit" class="add-btn" title="追加" aria-label="追加">＋</button>
  </form>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none;">アイテムがありません</div>
</div>

<script>
const STORAGE_KEY = 'baby-prep-list';

const defaultItems = [
  'おむつ', 'ベビーベッド', '抱っこ紐', '粉ミルク', 'ベビーカー',
  'チャイルドシート', '哺乳瓶', 'ベビーバス', '肌着・ベビー服', 'おしりふき',
].map(name => ({ name, price: null, url: '', purchased: false }));

function normalizeItem(item) {
  const price = Number(item.price);
  return {
    id: item.id || crypto.randomUUID(),
    name: String(item.name || ''),
    price: Number.isFinite(price) && item.price !== null && item.price !== '' ? price : null,
    url: String(item.url || ''),
    purchased: Boolean(item.purchased),
  };
}

function loadItems() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.map(normalizeItem);
    } catch (e) { /* fall through to defaults */ }
  }
  const initial = defaultItems.map(normalizeItem);
  saveItems(initial);
  return initial;
}

function saveItems(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

let items = loadItems();
let editingId = null;
let nameBeforeEdit = '';

function formatYen(n) {
  return '¥' + n.toLocaleString('ja-JP');
}

function normalizeUrl(url) {
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

function updateSummary() {
  const total = items.reduce((sum, item) => sum + (item.price || 0), 0);
  const purchasedTotal = items
    .filter(item => item.purchased)
    .reduce((sum, item) => sum + (item.price || 0), 0);
  const purchasedCount = items.filter(item => item.purchased).length;
  const unset = items.filter(item => item.price === null).length;

  document.getElementById('total-amount').textContent = formatYen(total);

  const meta = document.getElementById('summary-meta');
  meta.innerHTML = '';

  const countLine = document.createElement('span');
  countLine.innerHTML = '<b>' + items.length + '</b> 件'
    + (unset > 0 ? '（金額未入力 ' + unset + ' 件）' : '');
  meta.appendChild(countLine);

  const purchasedLine = document.createElement('span');
  purchasedLine.className = 'purchased-line';
  purchasedLine.innerHTML = '購入済み <b>' + purchasedCount + '</b> 件 ・ '
    + formatYen(purchasedTotal) + '　残り ' + formatYen(total - purchasedTotal);
  meta.appendChild(purchasedLine);
}

function render() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  empty.style.display = items.length === 0 ? 'block' : 'none';

  for (const item of items) {
    const isEditing = editingId === item.id;

    const card = document.createElement('div');
    card.className = 'item' + (item.purchased ? ' purchased' : '');

    const check = document.createElement('input');
    check.className = 'check';
    check.type = 'checkbox';
    check.checked = item.purchased;
    check.setAttribute('aria-label', item.name + ' を購入済みにする');
    check.addEventListener('change', () => {
      item.purchased = check.checked;
      saveItems(items);
      render();
    });
    card.appendChild(check);

    if (isEditing) {
      const nameInput = document.createElement('input');
      nameInput.className = 'edit-input name-input';
      nameInput.type = 'text';
      nameInput.value = item.name;
      nameInput.setAttribute('aria-label', 'アイテム名');
      nameInput.addEventListener('input', () => {
        item.name = nameInput.value;
        saveItems(items);
      });
      nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') finishEditing();
      });
      card.appendChild(nameInput);
    } else {
      const name = document.createElement('p');
      name.className = 'name';
      name.textContent = item.name;
      card.appendChild(name);
    }

    const priceField = document.createElement('div');
    priceField.className = 'price-field';

    const yen = document.createElement('span');
    yen.className = 'yen';
    yen.textContent = '¥';
    priceField.appendChild(yen);

    const priceInput = document.createElement('input');
    priceInput.className = 'price-input';
    priceInput.type = 'text';
    priceInput.inputMode = 'numeric';
    priceInput.placeholder = '—';
    priceInput.setAttribute('aria-label', item.name + ' の金額');
    // 未フォーカス時は桁区切り表示、編集中は生の数値にする
    priceInput.value = item.price === null ? '' : item.price.toLocaleString('ja-JP');
    priceInput.addEventListener('input', () => {
      const digits = priceInput.value.replace(/[^\d]/g, '');
      item.price = digits === '' ? null : Number(digits);
      saveItems(items);
      updateSummary();
    });
    priceInput.addEventListener('focus', () => {
      priceInput.value = item.price === null ? '' : String(item.price);
    });
    priceInput.addEventListener('blur', () => {
      priceInput.value = item.price === null ? '' : item.price.toLocaleString('ja-JP');
    });
    priceField.appendChild(priceInput);
    card.appendChild(priceField);

    if (isEditing) {
      const urlInput = document.createElement('input');
      urlInput.className = 'edit-input url-input';
      urlInput.type = 'text';
      urlInput.inputMode = 'url';
      urlInput.placeholder = 'URL（任意）';
      urlInput.value = item.url;
      urlInput.setAttribute('aria-label', 'URL');
      urlInput.addEventListener('input', () => {
        item.url = urlInput.value.trim();
        saveItems(items);
      });
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') finishEditing();
      });
      card.appendChild(urlInput);
    } else if (item.url) {
      const link = document.createElement('a');
      link.className = 'url';
      link.href = normalizeUrl(item.url);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = item.url.replace(/^https?:\/\//i, '');
      card.appendChild(link);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';

    if (isEditing) {
      const doneBtn = document.createElement('button');
      doneBtn.className = 'icon-btn done-btn';
      doneBtn.type = 'button';
      doneBtn.title = '編集を終了';
      doneBtn.setAttribute('aria-label', '編集を終了');
      doneBtn.textContent = '✓';
      doneBtn.addEventListener('click', finishEditing);
      actions.appendChild(doneBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn edit-btn';
      editBtn.type = 'button';
      editBtn.title = '編集';
      editBtn.setAttribute('aria-label', item.name + ' を編集');
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', () => startEditing(item));
      actions.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn delete-btn';
      delBtn.type = 'button';
      delBtn.title = '削除';
      delBtn.setAttribute('aria-label', item.name + ' を削除');
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => {
        items = items.filter(i => i.id !== item.id);
        saveItems(items);
        render();
      });
      actions.appendChild(delBtn);
    }

    card.appendChild(actions);
    list.appendChild(card);

    if (isEditing) {
      const nameInput = card.querySelector('.name-input');
      nameInput.focus();
      nameInput.setSelectionRange(nameInput.value.length, nameInput.value.length);
    }
  }

  updateSummary();
}

function startEditing(item) {
  editingId = item.id;
  nameBeforeEdit = item.name;
  render();
}

function finishEditing() {
  const item = items.find(i => i.id === editingId);
  // 名前が空のまま確定されたら元の名前に戻す
  if (item && item.name.trim() === '') {
    item.name = nameBeforeEdit;
    saveItems(items);
  }
  editingId = null;
  render();
}

document.getElementById('add-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const nameInput = document.getElementById('input-name');
  const priceInput = document.getElementById('input-price');
  const urlInput = document.getElementById('input-url');

  const name = nameInput.value.trim();
  if (!name) return;

  items.push(normalizeItem({
    name,
    price: priceInput.value.trim(),
    url: urlInput.value.trim(),
  }));
  saveItems(items);
  editingId = null;
  render();

  nameInput.value = '';
  priceInput.value = '';
  urlInput.value = '';
  nameInput.focus();
});

function escapeCsvField(field) {
  const str = String(field);
  return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

function exportCsv() {
  const total = items.reduce((sum, item) => sum + (item.price || 0), 0);
  const rows = [
    ['名前', '金額', 'URL', '購入済み'],
    ...items.map(item => [
      item.name,
      item.price === null ? '' : item.price,
      item.url,
      item.purchased ? '済' : '',
    ]),
    ['合計', total, '', ''],
  ];
  const csvContent = rows.map(row => row.map(escapeCsvField).join(',')).join('\r\n');

  const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = url;
  a.download = `baby-prep-list_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('export-btn').addEventListener('click', exportCsv);

render();
</script>
</body>
</html>

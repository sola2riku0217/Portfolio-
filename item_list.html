<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赤ちゃん用品準備リスト</title>
<style>
  :root {
    --bg: #fdf6f2;
    --card-bg: #ffffff;
    --accent: #f4a6a0;
    --accent-dark: #d97a72;
    --accent-soft: #fff0ee;
    --text: #4a4340;
    --text-light: #9a908c;
    --text-faint: #c4b8b3;
    --border: #f0e2db;
    --danger: #e57373;
    --shadow: 0 1px 3px rgba(120, 90, 80, 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 18px 16px 40px;
  }
  .container {
    max-width: 1120px;
    margin: 0 auto;
  }

  /* ---- header ---- */
  header {
    text-align: center;
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }

  /* ---- summary ---- */
  .summary {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .summary .total {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .summary .total .label {
    font-size: 12px;
    color: var(--text-light);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .summary .total .amount {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent-dark);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .summary .meta {
    font-size: 12px;
    color: var(--text-light);
    white-space: nowrap;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .summary .meta b {
    color: var(--text);
    font-weight: 600;
  }
  .summary .meta .purchased-line,
  .summary .meta .purchased-line b { color: var(--accent-dark); }
  .export-btn {
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent-dark);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .export-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  /* ---- add form ---- */
  .add-form {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 12px;
    margin-bottom: 16px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .add-form input {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    color: inherit;
    background: #fff;
    min-width: 0;
  }
  .add-form input:focus { border-color: var(--accent); }
  .add-form .f-name  { flex: 2 1 160px; }
  .add-form .f-price { flex: 0 1 120px; }
  .add-form .f-url   { flex: 3 1 200px; }
  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    width: 42px;
    height: 42px;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    transition: background 0.15s;
  }
  .add-btn:hover { background: var(--accent-dark); }

  /* ---- list ---- */
  .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
    gap: 10px;
    align-items: start;
  }
  .item {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 11px 12px 11px 36px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: opacity 0.15s, background 0.15s;
  }
  .item.purchased {
    background: var(--accent-soft);
    opacity: 0.72;
  }
  .item .check {
    position: absolute;
    top: 12px;
    left: 11px;
    width: 17px;
    height: 17px;
    margin: 0;
    accent-color: var(--accent-dark);
    cursor: pointer;
  }
  .item .name {
    font-weight: 600;
    font-size: 13.5px;
    margin: 0;
    padding-right: 46px;
    line-height: 1.35;
    word-break: break-word;
  }
  .item.purchased .name {
    text-decoration: line-through;
    color: var(--text-light);
  }
  .price-main {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent-dark);
    line-height: 1.15;
  }
  .price-main.no-price {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-faint);
  }

  /* ---- candidates ---- */
  .cands {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 3px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
  }
  .cand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    line-height: 1.4;
    padding: 1px 0;
  }
  .cand-radio {
    width: 13px;
    height: 13px;
    margin: 0;
    flex: 0 0 auto;
    accent-color: var(--accent-dark);
    cursor: pointer;
  }
  .cand-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-light);
  }
  .cand-price {
    white-space: nowrap;
    color: var(--text-light);
  }
  .cand.is-selected .cand-name,
  .cand.is-selected .cand-price {
    color: var(--text);
    font-weight: 600;
  }
  .cand.is-selected .cand-price { color: var(--accent-dark); }
  .cand-url {
    flex: 0 0 auto;
    color: var(--accent-dark);
    text-decoration: none;
    font-size: 10.5px;
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 6px;
    white-space: nowrap;
  }
  .cand-url:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .cands .no-cand {
    font-size: 11px;
    color: var(--text-faint);
  }

  /* ---- editing ---- */
  .edit-input {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 7px;
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    width: 100%;
    color: inherit;
    background: #fff;
  }
  .edit-input:focus { border-color: var(--accent); }
  .name-input {
    font-weight: 600;
    font-size: 13px;
    padding-right: 26px;
  }
  .cand.editing {
    align-items: flex-start;
    gap: 5px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
  }
  .cand.editing .cand-radio { margin-top: 7px; }
  .cand-fields {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cand-fields .edit-input {
    font-size: 11.5px;
    padding: 4px 6px;
  }
  .cand-del { margin-top: 3px; }
  .add-cand-btn {
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-light);
    border-radius: 8px;
    padding: 5px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    margin-top: 4px;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-cand-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  /* ---- buttons ---- */
  .item .actions {
    position: absolute;
    top: 5px;
    right: 5px;
    display: flex;
    gap: 1px;
  }
  .icon-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 13px;
    width: 22px;
    height: 22px;
    line-height: 1;
    border-radius: 7px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    transition: color 0.15s, background 0.15s;
  }
  .edit-btn:hover, .done-btn {
    color: var(--accent-dark);
    background: var(--accent-soft);
  }
  .done-btn:hover { background: var(--accent); color: #fff; }
  .delete-btn:hover, .cand-del:hover {
    color: var(--danger);
    background: #fdecea;
  }
  .empty {
    text-align: center;
    color: var(--text-light);
    padding: 40px 0;
    font-size: 14px;
  }

  @media (max-width: 560px) {
    .add-form { flex-wrap: wrap; }
    .add-form .f-name  { flex: 1 1 100%; }
    .add-form .f-price { flex: 1 1 90px; }
    .add-form .f-url   { flex: 3 1 120px; }
    .list { grid-template-columns: 1fr; }
    .summary { padding: 12px 16px; gap: 6px 12px; }
    .summary .total { flex: 1 1 100%; }
    .summary .meta { flex: 1 1 100%; white-space: normal; align-items: flex-start; }
    .summary .total .amount { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍼 赤ちゃん用品準備リスト</h1>
  </header>

  <div class="summary">
    <div class="total">
      <span class="label">合計</span>
      <span class="amount" id="total-amount">¥0</span>
    </div>
    <div class="meta" id="summary-meta"></div>
    <button type="button" class="export-btn" id="export-btn">CSV出力</button>
  </div>

  <form class="add-form" id="add-form">
    <input class="f-name" type="text" id="input-name" placeholder="アイテム名（例：おむつ）" required>
    <input class="f-price" type="number" id="input-price" placeholder="金額" min="0" step="1">
    <input class="f-url" type="text" id="input-url" placeholder="URL（任意）" inputmode="url">
    <button type="submit" class="add-btn" title="追加" aria-label="追加">＋</button>
  </form>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none;">アイテムがありません</div>
</div>

<script>
const STORAGE_KEY = 'baby-prep-list';

const defaultItems = [
  'おむつ', 'ベビーベッド', '抱っこ紐', '粉ミルク', 'ベビーカー',
  'チャイルドシート', '哺乳瓶', 'ベビーバス', '肌着・ベビー服', 'おしりふき',
].map(name => ({ name, candidates: [], purchased: false }));

function toPrice(value) {
  const num = Number(value);
  return Number.isFinite(num) && value !== null && value !== '' ? Math.max(0, num) : null;
}

function normalizeCandidate(cand) {
  return {
    id: cand.id || crypto.randomUUID(),
    name: String(cand.name || ''),
    price: toPrice(cand.price),
    url: String(cand.url || ''),
  };
}

function normalizeItem(item) {
  let candidates;
  if (Array.isArray(item.candidates)) {
    candidates = item.candidates.map(normalizeCandidate);
  } else if (toPrice(item.price) !== null || item.url) {
    // 旧形式（金額・URL がアイテム直下）を候補1件として引き継ぐ
    candidates = [normalizeCandidate({ name: '', price: item.price, url: item.url })];
  } else {
    candidates = [];
  }

  const hasSelected = candidates.some(c => c.id === item.selectedId);
  return {
    id: item.id || crypto.randomUUID(),
    name: String(item.name || ''),
    purchased: Boolean(item.purchased),
    candidates,
    selectedId: hasSelected ? item.selectedId : (candidates[0] ? candidates[0].id : null),
  };
}

function loadItems() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.map(normalizeItem);
    } catch (e) { /* 壊れていたら初期データで作り直す */ }
  }
  const initial = defaultItems.map(normalizeItem);
  saveItems(initial);
  return initial;
}

function saveItems(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

let items = loadItems();
let editingId = null;
let nameBeforeEdit = '';
let focusCandidateId = null;

function formatYen(n) {
  return '¥' + n.toLocaleString('ja-JP');
}

function normalizeUrl(url) {
  return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

/** 第1候補（未選択なら null） */
function selectedCandidate(item) {
  return item.candidates.find(c => c.id === item.selectedId) || null;
}

/** 第1候補の金額。候補なし・金額未入力なら null */
function selectedPrice(item) {
  const cand = selectedCandidate(item);
  return cand ? cand.price : null;
}

function updateSummary() {
  const total = items.reduce((sum, item) => sum + (selectedPrice(item) || 0), 0);
  const purchased = items.filter(item => item.purchased);
  const purchasedTotal = purchased.reduce((sum, item) => sum + (selectedPrice(item) || 0), 0);
  const unset = items.filter(item => selectedPrice(item) === null).length;

  document.getElementById('total-amount').textContent = formatYen(total);

  const meta = document.getElementById('summary-meta');
  meta.innerHTML = '';

  const countLine = document.createElement('span');
  countLine.innerHTML = '<b>' + items.length + '</b> 件'
    + (unset > 0 ? '（金額未入力 ' + unset + ' 件）' : '');
  meta.appendChild(countLine);

  const purchasedLine = document.createElement('span');
  purchasedLine.className = 'purchased-line';
  purchasedLine.innerHTML = '購入済み <b>' + purchased.length + '</b> 件 ・ '
    + formatYen(purchasedTotal) + '　残り ' + formatYen(total - purchasedTotal);
  meta.appendChild(purchasedLine);
}

/** 金額欄：未フォーカス時は桁区切り、編集中は素の数値 */
function attachPriceBehavior(input, getPrice, setPrice) {
  input.value = getPrice() === null ? '' : getPrice().toLocaleString('ja-JP');
  input.addEventListener('input', () => {
    const digits = input.value.replace(/[^\d]/g, '');
    setPrice(digits === '' ? null : Number(digits));
  });
  input.addEventListener('focus', () => {
    input.value = getPrice() === null ? '' : String(getPrice());
  });
  input.addEventListener('blur', () => {
    input.value = getPrice() === null ? '' : getPrice().toLocaleString('ja-JP');
  });
}

function buildCandidateRow(item, cand, isEditing) {
  const row = document.createElement('div');
  row.className = 'cand' + (isEditing ? ' editing' : '')
    + (cand.id === item.selectedId ? ' is-selected' : '');

  const radio = document.createElement('input');
  radio.className = 'cand-radio';
  radio.type = 'radio';
  radio.name = 'sel-' + item.id;
  radio.checked = cand.id === item.selectedId;
  radio.title = '第1候補にする';
  radio.setAttribute('aria-label', (cand.name || '候補') + ' を第1候補にする');
  radio.addEventListener('change', () => {
    item.selectedId = cand.id;
    saveItems(items);
    render();
  });
  row.appendChild(radio);

  if (!isEditing) {
    const name = document.createElement('span');
    name.className = 'cand-name';
    name.textContent = cand.name || '(名称未設定)';
    name.title = cand.name || '(名称未設定)';
    row.appendChild(name);

    const price = document.createElement('span');
    price.className = 'cand-price';
    price.textContent = cand.price === null ? '—' : formatYen(cand.price);
    row.appendChild(price);

    if (cand.url) {
      const link = document.createElement('a');
      link.className = 'cand-url';
      link.href = normalizeUrl(cand.url);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'URL';
      link.title = cand.url;
      row.appendChild(link);
    }
    return row;
  }

  const fields = document.createElement('div');
  fields.className = 'cand-fields';

  const nameInput = document.createElement('input');
  nameInput.className = 'edit-input';
  nameInput.type = 'text';
  nameInput.placeholder = '製品名';
  nameInput.value = cand.name;
  nameInput.dataset.candName = cand.id;
  nameInput.setAttribute('aria-label', '製品名');
  nameInput.addEventListener('input', () => {
    cand.name = nameInput.value;
    saveItems(items);
  });
  nameInput.addEventListener('keydown', onEditKeydown);
  fields.appendChild(nameInput);

  const priceInput = document.createElement('input');
  priceInput.className = 'edit-input';
  priceInput.type = 'text';
  priceInput.inputMode = 'numeric';
  priceInput.placeholder = '金額';
  priceInput.setAttribute('aria-label', '金額');
  attachPriceBehavior(priceInput, () => cand.price, (value) => {
    cand.price = value;
    saveItems(items);
    updateSummary();
    updatePriceMain(item);
  });
  priceInput.addEventListener('keydown', onEditKeydown);
  fields.appendChild(priceInput);

  const urlInput = document.createElement('input');
  urlInput.className = 'edit-input';
  urlInput.type = 'text';
  urlInput.inputMode = 'url';
  urlInput.placeholder = 'URL（任意）';
  urlInput.value = cand.url;
  urlInput.setAttribute('aria-label', 'URL');
  urlInput.addEventListener('input', () => {
    cand.url = urlInput.value.trim();
    saveItems(items);
  });
  urlInput.addEventListener('keydown', onEditKeydown);
  fields.appendChild(urlInput);

  row.appendChild(fields);

  const delBtn = document.createElement('button');
  delBtn.className = 'icon-btn cand-del';
  delBtn.type = 'button';
  delBtn.title = 'この候補を削除';
  delBtn.setAttribute('aria-label', 'この候補を削除');
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', () => {
    item.candidates = item.candidates.filter(c => c.id !== cand.id);
    if (item.selectedId === cand.id) {
      item.selectedId = item.candidates[0] ? item.candidates[0].id : null;
    }
    saveItems(items);
    render();
  });
  row.appendChild(delBtn);

  return row;
}

/** 第1候補の金額表示だけを差し替える（入力中の再描画を避けるため） */
function updatePriceMain(item) {
  const el = document.querySelector('[data-price-main="' + item.id + '"]');
  if (!el) return;
  const price = selectedPrice(item);
  el.textContent = price === null ? '金額未入力' : formatYen(price);
  el.className = 'price-main' + (price === null ? ' no-price' : '');
}

function onEditKeydown(e) {
  if (e.key === 'Enter') finishEditing();
}

function render() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  empty.style.display = items.length === 0 ? 'block' : 'none';

  for (const item of items) {
    const isEditing = editingId === item.id;

    const card = document.createElement('div');
    card.className = 'item' + (item.purchased ? ' purchased' : '');

    const check = document.createElement('input');
    check.className = 'check';
    check.type = 'checkbox';
    check.checked = item.purchased;
    check.setAttribute('aria-label', item.name + ' を購入済みにする');
    check.addEventListener('change', () => {
      item.purchased = check.checked;
      saveItems(items);
      render();
    });
    card.appendChild(check);

    if (isEditing) {
      const nameInput = document.createElement('input');
      nameInput.className = 'edit-input name-input';
      nameInput.type = 'text';
      nameInput.value = item.name;
      nameInput.setAttribute('aria-label', 'アイテム名');
      nameInput.addEventListener('input', () => {
        item.name = nameInput.value;
        saveItems(items);
      });
      nameInput.addEventListener('keydown', onEditKeydown);
      card.appendChild(nameInput);
    } else {
      const name = document.createElement('p');
      name.className = 'name';
      name.textContent = item.name;
      card.appendChild(name);
    }

    // 候補が1件もないカードは金額行を出さず「候補なし」だけにする
    if (item.candidates.length > 0) {
      const price = selectedPrice(item);
      const priceMain = document.createElement('div');
      priceMain.className = 'price-main' + (price === null ? ' no-price' : '');
      priceMain.dataset.priceMain = item.id;
      priceMain.textContent = price === null ? '金額未入力' : formatYen(price);
      card.appendChild(priceMain);
    }

    const cands = document.createElement('div');
    cands.className = 'cands';
    if (item.candidates.length === 0 && !isEditing) {
      const none = document.createElement('span');
      none.className = 'no-cand';
      none.textContent = '候補なし';
      cands.appendChild(none);
    }
    for (const cand of item.candidates) {
      cands.appendChild(buildCandidateRow(item, cand, isEditing));
    }

    const addCandBtn = document.createElement('button');
    addCandBtn.className = 'add-cand-btn';
    addCandBtn.type = 'button';
    addCandBtn.textContent = '＋ 候補を追加';
    addCandBtn.addEventListener('click', () => addCandidate(item));
    cands.appendChild(addCandBtn);

    card.appendChild(cands);

    const actions = document.createElement('div');
    actions.className = 'actions';

    if (isEditing) {
      const doneBtn = document.createElement('button');
      doneBtn.className = 'icon-btn done-btn';
      doneBtn.type = 'button';
      doneBtn.title = '編集を終了';
      doneBtn.setAttribute('aria-label', '編集を終了');
      doneBtn.textContent = '✓';
      doneBtn.addEventListener('click', finishEditing);
      actions.appendChild(doneBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn edit-btn';
      editBtn.type = 'button';
      editBtn.title = '編集';
      editBtn.setAttribute('aria-label', item.name + ' を編集');
      editBtn.textContent = '✎';
      editBtn.addEventListener('click', () => startEditing(item));
      actions.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn delete-btn';
      delBtn.type = 'button';
      delBtn.title = '削除';
      delBtn.setAttribute('aria-label', item.name + ' を削除');
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => {
        items = items.filter(i => i.id !== item.id);
        saveItems(items);
        render();
      });
      actions.appendChild(delBtn);
    }

    card.appendChild(actions);
    list.appendChild(card);

    if (isEditing) {
      const target = focusCandidateId
        ? card.querySelector('[data-cand-name="' + focusCandidateId + '"]')
        : card.querySelector('.name-input');
      if (target) {
        target.focus();
        target.setSelectionRange(target.value.length, target.value.length);
      }
      focusCandidateId = null;
    }
  }

  updateSummary();
}

function addCandidate(item) {
  const cand = normalizeCandidate({ name: '', price: '', url: '' });
  item.candidates.push(cand);
  if (!item.selectedId) item.selectedId = cand.id;
  saveItems(items);
  editingId = item.id;
  focusCandidateId = cand.id;
  render();
}

function startEditing(item) {
  editingId = item.id;
  nameBeforeEdit = item.name;
  render();
}

function finishEditing() {
  const item = items.find(i => i.id === editingId);
  if (item) {
    // 名前が空のまま確定されたら元の名前に戻す
    if (item.name.trim() === '') item.name = nameBeforeEdit;
    // 中身が空のままの候補は残さない
    item.candidates = item.candidates.filter(
      c => c.name.trim() !== '' || c.price !== null || c.url !== ''
    );
    if (!item.candidates.some(c => c.id === item.selectedId)) {
      item.selectedId = item.candidates[0] ? item.candidates[0].id : null;
    }
    saveItems(items);
  }
  editingId = null;
  render();
}

document.getElementById('add-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const nameInput = document.getElementById('input-name');
  const priceInput = document.getElementById('input-price');
  const urlInput = document.getElementById('input-url');

  const name = nameInput.value.trim();
  if (!name) return;

  const price = priceInput.value.trim();
  const url = urlInput.value.trim();
  const candidates = (price !== '' || url !== '')
    ? [{ name: '', price, url }]
    : [];

  items.push(normalizeItem({ name, candidates }));
  saveItems(items);
  editingId = null;
  render();

  nameInput.value = '';
  priceInput.value = '';
  urlInput.value = '';
  nameInput.focus();
});

function escapeCsvField(field) {
  const str = String(field);
  return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

function exportCsv() {
  const total = items.reduce((sum, item) => sum + (selectedPrice(item) || 0), 0);
  const rows = [['アイテム', '候補名', '金額', 'URL', '第1候補', '購入済み']];

  for (const item of items) {
    const purchasedMark = item.purchased ? '済' : '';
    if (item.candidates.length === 0) {
      rows.push([item.name, '', '', '', '', purchasedMark]);
      continue;
    }
    for (const cand of item.candidates) {
      rows.push([
        item.name,
        cand.name,
        cand.price === null ? '' : cand.price,
        cand.url,
        cand.id === item.selectedId ? '★' : '',
        purchasedMark,
      ]);
    }
  }
  rows.push(['合計', '', total, '', '', '']);

  const csvContent = rows.map(row => row.map(escapeCsvField).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const dateStr = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = url;
  a.download = `baby-prep-list_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('export-btn').addEventListener('click', exportCsv);

render();
</script>
</body>
